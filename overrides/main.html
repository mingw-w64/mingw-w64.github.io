{% extends "base.html" %}

{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ page.title | striptags }} - {{ config.site_name }}">
  {% if page.meta and page.meta.description %}
    <meta property="og:description" content="{{ page.meta.description }}">
  {% elif config.site_description %}
    <meta property="og:description" content="{{ config.site_description }}">
  {% endif %}
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ config.site_name }} - {{ config.site_description }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | striptags }} - {{ config.site_name }}">
  {% if page.meta and page.meta.description %}
    <meta name="twitter:description" content="{{ page.meta.description }}">
  {% elif config.site_description %}
    <meta name="twitter:description" content="{{ config.site_description }}">
  {% endif %}
  <meta name="twitter:image" content="{{ config.site_url }}/og-image.png">
{% endblock %}
